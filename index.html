<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Om LifeOS</title>
    <meta name="description" content="Executive personal operating system: tasks, goals, routines, finance, health, notes and Google Drive backup." />
    <meta property="og:title" content="Om LifeOS" />
    <meta property="og:description" content="Executive personal operating system: tasks, goals, routines, finance, health, notes and Google Drive backup." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#B88648" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('om_theme') !== 'light') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0B0F19';
          }
          var omAccent = localStorage.getItem('om_accent');
          if (omAccent && omAccent.toLowerCase() === '#6366f1' && localStorage.getItem('om_accent_user_selected') !== 'true') {
            omAccent = '#b88648';
            localStorage.setItem('om_accent', omAccent);
          }
          if (omAccent) document.documentElement.style.setProperty('--color-brand', omAccent);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0B0F19';
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Om-LifeOS" />
    <meta name="application-name" content="Om-LifeOS" />
    <meta name="msapplication-TileColor" content="#B88648" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  </head>
  <body class="text-slate-900 antialiased selection:bg-indigo-500 selection:text-white dark:bg-[#0B0F19] dark:text-slate-100 min-h-screen">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <noscript>Om needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
