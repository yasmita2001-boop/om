name: Build and Release Om-LifeOS (Windows EXE & Web Browser PWA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v4.8.4)"
        required: false
        default: "v4.8.4"

permissions:
  contents: write

jobs:
  # ==========================================
  # WEB BROWSER PWA BUILD JOB
  # ==========================================
  web:
    name: Build Web Browser PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (clean lockfile for public npm registry)
        run: |
          rm -f package-lock.json bun.lock
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web PWA Assets
        run: npm run build

      - name: Package Web Distribution
        run: |
          cd dist
          zip -r ../Om-LifeOS-Web-PWA.zip ./*
          cd ..

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Om-LifeOS-Web-PWA
          path: dist/
          if-no-files-found: warn

      - name: Attach Web Zip to GitHub Release (If tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Om-LifeOS-Web-PWA.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # WINDOWS BUILD JOB (.exe / NSIS Installer)
  # ==========================================
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies (clean lockfile for public npm registry)
        shell: bash
        run: |
          rm -f package-lock.json bun.lock
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Windows Application (.exe NSIS Installer)
        run: npx tauri build --bundles nsis --ci

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Om-LifeOS-Windows-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Attach Windows EXE to GitHub Release (If tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

